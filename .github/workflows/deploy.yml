name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout website
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.31.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: node --test scripts/studio-deployment.test.mjs
      - run: pnpm build

      - name: Select the latest passing Design Studio source
        id: studio
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const selectSource = require('./scripts/select-studio-source.cjs');
            await selectSource({ github, core });
      - name: Checkout Design Studio at the tested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ steps.studio.outputs.repository }}
          ref: ${{ steps.studio.outputs.sha }}
          path: studio-source
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5
        with:
          working_directory: studio-source
      - name: Install Studio dependencies
        working-directory: studio-source
        run: mise exec -- pnpm install --frozen-lockfile
      - name: Build the demo for its public path
        working-directory: studio-source
        env:
          STUDIO_BASE_PATH: /design-studio-demo/
        run: |
          mise exec -- pnpm build
          mise exec -- pnpm build:inspect
      - name: Include the demo in the website output
        run: node scripts/include-studio-demo.mjs studio-source/dist
      - name: Upload the combined website and demo
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    permissions:
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
